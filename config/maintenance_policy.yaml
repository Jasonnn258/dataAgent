# 维护策略参数（Phase 11I）—— 策略旋钮，不是算法。
#
# 这些数字决定"系统倾向怎么判"，而不是"怎么算"：挪到这里之后，
# Policy A vs Policy B 消融只改本文件 + version，不动代码。
#
# 加载：src/config.py::maintenance_policy()（PyYAML 缺席时用内置
# 极简解析器，格式保持本文件这种两层层级 + 标量）。缺键一律回退
# DEFAULT_MAINTENANCE_POLICY，保证任何环境下行为可复现。
#
# 消融钩子：set_maintenance_policy(cfg) 进程内覆盖（见 11J eval）；
# scoring 权重在 skill import 时固化，A/B 消融需 reload 模块。

version: "13J.1"

rollback:
  scoring:
    label: 3.0          # 命中变更单元主标签（最强信号）
    ui: 2.0             # UI 文案/字符串面命中
    symbol: 2.0         # 符号名命中
    file: 1.0           # 文件路径面命中
    label_partial: 0.7  # label 子串/部分命中折扣
  tie_break:
    # 平局归问题侧：嫌疑犯 stays 嫌疑犯（宁可多回退交人工复核）。
    # 设为 false 则平局归 keep 侧（宁可不回退）。
    prefer_problem_side: true

policy:
  action_risk:
    PASS: low
    HUMAN_REVIEW: medium
    BLOCK: high

# 执行层策略门（Phase 13H）：规则名 → 动作。规则什么时候触发是代码里
# 的确定性事实检测（src/maintenance/execution_policy.py）；触发后做什么
# 是这里的策略旋钮 —— BLOCK/HUMAN_REVIEW 档位可以按仓库风险调。
execution_policy:
  pre_gate:
    # 执行前看什么：计划本身的危险面
    public_api_change: HUMAN_REVIEW       # 动到公开 API 路由
    auth_change: HUMAN_REVIEW             # 动到认证/登录/凭据面
    same_symbol_rollback_keep: HUMAN_REVIEW   # 同符号又回退又保留
  post_gate:
    # 执行后看什么：沙箱里实际发生的事。这四个是硬红线。
    unexpected_file_change: BLOCK         # 计划外文件被改
    forbidden_keep_change: BLOCK          # keep 侧被损伤
    repository_state_changed: BLOCK       # 源仓库在执行期变了
    apply_check_failed: BLOCK             # patch 在 base 状态就贴不上
    test_failed: BLOCK                    # 验证命令失败（可调 HUMAN_REVIEW）
    public_api_change: HUMAN_REVIEW
    auth_change: HUMAN_REVIEW
    same_symbol_rollback_keep: HUMAN_REVIEW
  # PASS 也不能自动 push —— promote 之后仍然只留工作树改动，
  # commit/push 永远是人的动作（13J 同步读取本开关）。
  auto_push: false
  # 晋升总开关（13J）：默认关闭。true 也不解锁 push，只解锁
  # PromotePatchSkill 的受控 apply（仍需 READY_TO_PROMOTE + 显式批准）。
  promote_enabled: false
